name: Probe keiba results source

on:
  push:
    branches:
      - chore/keiba-2026-08-fetch-probe-20260901
    paths:
      - .github/workflows/probe-keiba-results.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-keiba-results-source
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch sample pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          curl --fail --location --retry 3 \
            --user-agent 'Mozilla/5.0 (compatible; keiba-data-backfill/1.0)' \
            --dump-header probe/sample.headers \
            --output probe/sample.html \
            https://data.keiba-intelligence.jp/jra/results/2026/08/08/sapporo/8/
          for path in robots.txt sitemap.xml sitemap_index.xml; do
            curl --location --retry 2 \
              --user-agent 'Mozilla/5.0 (compatible; keiba-data-backfill/1.0)' \
              --dump-header "probe/${path//\//_}.headers" \
              --output "probe/${path//\//_}" \
              "https://data.keiba-intelligence.jp/$path" || true
          done
          wc -c probe/*
          head -n 80 probe/sample.html

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: keiba-results-probe
          path: probe/
          if-no-files-found: error
          retention-days: 3
