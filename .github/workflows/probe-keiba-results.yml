name: Probe keiba results source

on:
  push:
    branches:
      - chore/keiba-2026-08-fetch-probe-20260901
    paths:
      - .github/workflows/probe-keiba-results.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-keiba-results-source
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch sample and sitemaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          base=https://data.keiba-intelligence.jp
          ua='Mozilla/5.0 (compatible; keiba-data-backfill/1.0)'
          curl --fail --location --retry 3 --user-agent "$ua" \
            --dump-header probe/sample.headers --output probe/sample.html \
            "$base/jra/results/2026/08/08/sapporo/8/"
          curl --fail --location --retry 3 --user-agent "$ua" \
            --output probe/robots.txt "$base/robots.txt"
          curl --fail --location --retry 3 --user-agent "$ua" \
            --output probe/sitemap-index.xml "$base/sitemap-index.xml"
          curl --fail --location --retry 3 --user-agent "$ua" \
            --output probe/sitemap-0.xml "$base/sitemap-0.xml"
          grep -o 'https://[^<]*' probe/sitemap-0.xml \
            | grep '/results/2026/08/' \
            | sort -u > probe/urls-2026-08.txt
          grep '/jra/results/2026/08/.*/[0-9]\+/$' probe/urls-2026-08.txt \
            > probe/jra-race-urls-2026-08.txt || true
          grep '/nankan/results/2026/08/.*/[0-9]\+/$' probe/urls-2026-08.txt \
            > probe/nankan-race-urls-2026-08.txt || true
          wc -l probe/*urls-2026-08.txt
          tail -n 30 probe/jra-race-urls-2026-08.txt || true

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: keiba-results-probe
          path: probe/
          if-no-files-found: error
          retention-days: 3
